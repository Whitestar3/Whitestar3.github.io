<script>
/* Si algo falla al iniciar, se muestra el motivo en pantalla (en vez de quedar en blanco) */
window.addEventListener('error', function(e){
  var l = document.getElementById('loading'); if(!l) return;
  l.classList.remove('done'); l.querySelector('div').innerHTML = '<b style="color:#f87171">No se pudo iniciar el Check-in</b><span style="max-width:560px;text-align:center;line-height:1.5">'+(e.message||'error')+'<br><small>'+(e.filename||'').split('/').pop()+':'+(e.lineno||'')+'</small></span>';
});

<style>

  body.dark{--bg:#0a0f18;--card:rgba(15,23,35,.94);--cardb:rgba(255,255,255,.08);--txt:#e6edf3;--mut:#8b9aab;--acc:#6ea0ff;--accbg:rgba(110,160,255,.16);
        --ok:#4ade80;--okbg:rgba(34,197,94,.16);--warn:#fbbf24;--warnbg:rgba(245,158,11,.16);--bad:#f87171;--badbg:rgba(239,68,68,.18);--burn:#c4b5fd;--burnbg:rgba(139,92,246,.2);--chip:rgba(255,255,255,.05);--line:rgba(255,255,255,.07);
        --shadow:0 12px 32px rgba(0,0,0,.5)}

  .tabs{display:flex;gap:3px;background:var(--chip);padding:3px;border-radius:9px;border:1px solid var(--cardb)}
  .tabs button{flex:1;padding:4px 6px;font-size:.68rem;font-weight:700;border-radius:7px;color:var(--mut);white-space:nowrap}
  .tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .sech{font-size:.6rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:5px 2px 1px}
  .bar{height:5px;border-radius:3px;background:var(--cardb);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
  .cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .cnt div{background:var(--chip);border:1px solid var(--cardb);border-radius:9px;padding:5px 2px;text-align:center}
  .cnt b{display:block;font-size:.95rem;line-height:1.1}.cnt small{font-size:.5rem;text-transform:uppercase}
  #info{position:fixed;bottom:14px;left:310px;width:300px;z-index:26;padding:11px 12px;display:none;max-height:calc(100vh - 100px);overflow:auto}
  #info .ih{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  #info .tt{flex:1;min-width:0}
  #info .eyebrow{font-size:.58rem;font-weight:700;letter-spacing:.6px;color:var(--acc);text-transform:uppercase}
  #info b.title{display:block;font-size:.92rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #info .ibtn{width:26px;height:26px;border-radius:8px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:.72rem}
  .kv span{color:var(--mut)}.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .ipal{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--line);font-size:.68rem;cursor:pointer}
  .ipal:hover{color:var(--acc)}
  #tip{position:fixed;z-index:60;pointer-events:none;display:none;background:var(--card);border:1px solid var(--cardb);box-shadow:var(--shadow);border-radius:9px;padding:5px 10px;font-size:.72rem;font-weight:600;line-height:1.35}
  #tip small{display:block;font-weight:500}
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:70;background:var(--txt);color:var(--bg);padding:9px 16px;border-radius:11px;font-size:.78rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #loading{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;transition:opacity .6s}
  #loading.done{opacity:0;pointer-events:none}
  #loading div{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mut);font-size:.8rem}
  #loading i{width:34px;height:34px;border-radius:50%;border:3px solid var(--cardb);border-top-color:var(--acc);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:1560px){ .chips .chip:nth-child(4){display:none} }
  @media (max-width:1420px){ .chips .chip:nth-child(3){display:none} }
  @media (max-width:1250px){ .chips{display:none} .logo small{display:none} }
  @media (max-width:1100px){ #pr{display:none} .sel{display:none} }
  @media (max-width:860px){ #pl{display:none} #info{left:14px;width:calc(100vw - 28px)} .search{display:none} }
</style>

<body>
<canvas id="c"></canvas>
<div id="loading"><div><i></i><span id="loadtxt">Cargando Check-in CD-01…</span></div></div>

<header id="top" class="card">

<script>
/* ════════════════════════════════════════════════════════════════════════════
   SKYNET · CHECK-IN COMPLETO — CD-01
   · 81 bancadas WT en línea: HS 68-81 · DCI 1-19 · GM 20-50 · RK 51-67 (mesa de tubos, laptop, Zebra, cono, totes)
   · Flujo: pallet de stage → bancada (rep) → conveyor trasero → Mezanina
   · Datos: datasets publicados por n8n `stage_data` y `reps_data` (los que publica tu n8n). Sin conexión → modo DEMO con el mismo formato.
   ════════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a), pick = a => a[Math.floor(Math.random()*a.length)], pad2 = n => String(n).padStart(2,'0');

// ══ CONFIG ═════════════════════════════════════════════════════════════════
const DATA_DOCS = ['YOUR_DOCUMENT_ID','YOUR_DOCUMENT_ID'];   // ← fuentes de datos donde se publican los datasets (se prueba en orden)
const GRID_BASE = 'https://YOUR_DATA_HOST';
const DS = { stage:'stage_data', reps:'reps_data' };
const REFRESH_MS = 60000;
// SLA acumulado desde que el pallet llegó a IS (Stage 24h + Check-in 12h + Putaway 12h): <30 verde · 30-33 amarillo · 33-36 rojo · ≥36 quemado
const ageBucket = h => h<30 ? 'green' : h<33 ? 'yellow' : h<36 ? 'red' : 'burnt';
const SEMAFORO_MAP = { QUEMADO:'burnt', ROJO:'red', AMARILLO:'yellow', VERDE:'green' };
const BCOL = { green:0x22c55e, yellow:0xf1c40f, red:0xef4444, burnt:0x7c3aed };
const BLBL = { green:'Verde <30h', yellow:'Atención 30-33h', red:'Rojo 33-36h', burnt:'Quemado ≥36h' };
const TOTES_OK = 5;                      // totes/hora desde el cual el rep se considera "productivo" (umbral supuesto, ajustalo)
const IDLE_STREAK = 3;                   // refrescos seguidos sin procesar para marcar "ociosidad extendida"
const ZONES = { HS:{name:'HS',desc:'No toteable',hex:0x3b82f6,css:'#3b82f6'}, DCI:{name:'DCI',desc:'DCI',hex:0xf59e0b,css:'#f59e0b'}, GM:{name:'GM',desc:'General Merchandise',hex:0x10b981,css:'#10b981'}, RK:{name:'RK',desc:'Rack',hex:0xeab308,css:'#eab308'} };
const SEQ = [];                          // 81 bancadas en orden físico
for(let i=68;i<=81;i++) SEQ.push({id:i, zone:'HS'});
for(let i=1;i<=19;i++)  SEQ.push({id:i, zone:'DCI'});
for(let i=20;i<=50;i++) SEQ.push({id:i, zone:'GM'});
for(let i=51;i<=67;i++) SEQ.push({id:i, zone:'RK'});
const N = SEQ.length, SP = 1.8, LEN = N*SP;      // separación entre bancadas · largo total (≈146 m)
const IDX = new Map(SEQ.map((b,i)=>[b.id,i]));
const bx = i => i*SP + SP/2;
const Z_CONV = 3.1, Z_REP = 1.15, Z_PAL = [-1.35,-2.6,-3.85,-5.1], Z_OUT = [2.9,4.15,5.4];   // atrás: pallets por procesar · adelante: lo procesado listo para putaway
const OUT_LBL = {HS:'jaulas', DCI:'carros', GM:'sorter', RK:'pallets'}, OUT_CAP = {HS:8, DCI:6, RK:12};   // capacidad supuesta (totes por contenedor) para dibujar cuántos se arman

const ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', rotl:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>', rotr:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  sideL:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>', sideR:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>', moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',

class SimpleOrbit {
  constructor(camera, dom){
    this.camera = camera; this.dom = dom; this.target = new THREE.Vector3();
    this.minDistance = 2.5; this.maxDistance = 360; this.minPolarAngle = .04; this.maxPolarAngle = Math.PI*.495; this.enableDamping = true;
    this.dTheta = 0; this.dPhi = 0; this.dZoom = 0; this.pan = new THREE.Vector3(); this.ptrs = new Map(); this.pinch = 0; this.moved = 0;
    dom.style.touchAction = 'none'; dom.addEventListener('contextmenu', e=>e.preventDefault());

    dom.addEventListener('pointermove', e=>{
      const p = this.ptrs.get(e.pointerId); if(!p) return;
      const dx = e.clientX-p.x, dy = e.clientY-p.y; p.x = e.clientX; p.y = e.clientY; this.moved += Math.abs(dx)+Math.abs(dy);
      if(this.ptrs.size===1){ if(e.buttons&2 || e.shiftKey || e.ctrlKey) this._panBy(dx,dy); else { const h = Math.max(1,dom.clientHeight); this.dTheta -= 2*Math.PI*dx/h; this.dPhi -= 2*Math.PI*dy/h; } }
      else if(this.ptrs.size===2){ const d = this._pd(); if(this.pinch) this.dZoom += (this.pinch-d)*.006; this.pinch = d; }
    });
    const up = e=>{ this.ptrs.delete(e.pointerId); this.pinch = 0; };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('wheel', e=>{ e.preventDefault(); this.dZoom += Math.sign(e.deltaY)*.14; }, {passive:false});
  }
  _pd(){ if(this.ptrs.size<2) return 0; const [a,b] = [...this.ptrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y); }
  _panBy(dx,dy){
    const cam = this.camera, k = 2*cam.position.distanceTo(this.target)*Math.tan(cam.fov*Math.PI/360)/Math.max(1,this.dom.clientHeight);
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrix,0); right.y = 0; right.normalize();
    const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();

  }

  }
}

function rebuildDynamic(){

  palItems = []; pickGroups = [];

  palItems.forEach((it,i)=>{ it.i = i; it.f = Math.min(it.p.units||600,2200)/2200; it.h = .8 + it.f*.9; });
  const group = (mesh, refs, base) => { pickGroups.push({mesh, refs, base}); return mesh; };
  const tag = (list,fy)=>mkInst(BOX, basic(0xffffff), list.map(it=>({x:it.x,y:fy(it),z:it.z+.52,sx:.55,sy:.26,sz:.03,c:BCOL[it.p.bucket]})), true, dyn);

    mkInst(BOX, std(0x9aa4b2,.4,.5), ct.flatMap(it=>[[-.45,-.3],[.45,-.3],[-.45,.3],[.45,.3]].map(([dx,dz])=>({x:it.x+dx,y:.85,z:it.z+dz,sx:.04,sy:1.4,sz:.04}))), false, dyn);
    mkInst(BOX, std(0x9aa4b2,.4,.5), ct.map(it=>({x:it.x,y:1.52,z:it.z-.3,sx:.95,sy:.04,sz:.04})), false, dyn);
    mkInst(BOX, std(0x222222,.6), ct.flatMap(it=>[[-.42,-.26],[.42,-.26],[-.42,.26],[.42,.26]].map(([dx,dz])=>({x:it.x+dx,y:.06,z:it.z+dz,sx:.1,sy:.12,sz:.1}))), false, dyn);

}

function selectRep(b,fly){

  showInfo('Rep en bancada', r.ldap, 'person', kv('Bancada', wt(b)+' · '+SEQ[IDX.get(b)].zone) + kv('User ID', r.uid||'—') + kv('Estado', stPill(repStatus(r))) + kv('Totes (última hora)', `<b>${r.totes}</b>`) +
    kv('Último movimiento', r.mins!=null ? `hace ${r.mins} min` : '—') + kv('Tote activo', r.active ? `<span class="mono">${r.active}</span>` : '—') + kv('Ociosidad', st>=IDLE_STREAK ? `<span class="pill bad">extendida · ${st} refrescos</span>` : st ? `${st} refresco(s)` : 'no') +
    kv('Últimos totes', r.codes.slice(0,3).map(c=>`<span class="mono" style="font-size:.64rem">${c}</span>`).join('<br>')||'—') + kv('Umbral productivo', `≥ ${TOTES_OK} totes/h`));
  if(fly) flyBench(b);
}
function selectPallet(k,fly){
  const p = pallets[k]; if(!p) return; sel = {type:'pal', k}; const r = p.bancada ? repsByB.get(p.bancada) : null;
  showInfo('Pallet en stage', String(p.id).slice(0,24), 'box', kv('SLA', `<span class="pill ${cls(p.bucket)}">${BLBL[p.bucket]}</span>`) + kv('Horas SLA / reales', `${p.hrs.toFixed(1)} h / ${p.hrsReal.toFixed(1)} h`) + kv('Ubicación', `<span class="mono">${p.addr}</span>`) + kv('Estado', p.status) +
    kv('Seller', `${p.seller} · ${p.sellerType}`) + kv('Familia', p.familia) + kv('Unidades', p.units) + kv('DCI', p.dci) + kv('Inbound', `<span class="mono">${p.inbound}</span>`) + kv('Dock / transporte', `${p.dock} · ${p.tipo} ${p.patente!=='—'?p.patente:''}`) + kv('Rep en bancada', r ? r.ldap : p.bancada ? 'sin rep' : '—'));
  const it = palItems.find(x=>x.p===p); if(fly){ if(it) flyTo(new THREE.Vector3(it.x-3,4,it.z+7), new THREE.Vector3(it.x,.8,it.z)); else if(p.bancada) flyBench(p.bancada); }
}

// ══ INTERACCIÓN ════════════════════════════════════════════════════════════
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
function pickAt(ev){
  mouse.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hr = ray.intersectObjects(pickables, false)[0], hp = pickGroups.map(g=>{ const h = ray.intersectObject(g.mesh,false)[0]; return h && {distance:h.distance, it:g.refs[h.instanceId]}; }).filter(Boolean).sort((a,b)=>a.distance-b.distance)[0], ht = ray.intersectObject(tiles, false)[0];
  const best = [hr&&{d:hr.distance,v:{type:'rep',r:hr.object.userData.rep}}, hp&&{d:hp.distance,v:{type:'pal',it:hp.it}}, ht&&{d:ht.distance+1.5,v:{type:'bench',b:SEQ[ht.instanceId].id}}].filter(Boolean).sort((a,b)=>a.d-b.d)[0];
  return best ? best.v : null;
}
canvas.addEventListener('pointermove', ev=>{
  const p = pickAt(ev); tip.style.display = 'none';
  if(p){ tip.innerHTML = p.type==='rep' ? `${p.r.ldap}<small>${wt(p.r.b)} · ${p.r.totes} totes/h</small>` : p.type==='pal' ? `${String(p.it.p.id).slice(0,18)}<small>${p.it.p.hrs.toFixed(1)} h · ${p.it.p.seller}</small>` : `${wt(p.b)}<small>${SEQ[IDX.get(p.b)].zone} · ${repsByB.has(p.b)?repsByB.get(p.b).ldap:'sin rep'} · ${benchPallets(p.b).length} pallets</small>`;
    tip.style.display = 'block'; tip.style.left = (ev.clientX+14)+'px'; tip.style.top = (ev.clientY+14)+'px'; }
  canvas.style.cursor = p ? 'pointer' : 'default';
});
let downAt = null; canvas.addEventListener('pointerdown', ev=>{ downAt = {x:ev.clientX,y:ev.clientY}; });
canvas.addEventListener('pointerup', ev=>{
  if(!downAt || Math.hypot(ev.clientX-downAt.x, ev.clientY-downAt.y)>5) return;
  const p = pickAt(ev); if(!p){ clearSel(); return; }
  if(p.type==='rep') selectRep(p.r.b,false); else if(p.type==='pal') selectPallet(p.it.p.k,false); else selectBench(p.b,false);
});
function act(s){
  const [k,a] = s.split(':');
  if(k==='rep') selectRep(+a,true); else if(k==='bench') selectBench(+a,true); else if(k==='pal') selectPallet(+a,true); else if(k==='zone') setZone(a);
}
['pl-list','pr-list','zcards','i-body'].forEach(id=>$(id).addEventListener('pointerdown', e=>{ const n = e.target.closest('[data-act]'); if(n) act(n.dataset.act); }));
document.querySelectorAll('#seg-zone button').forEach(b=>b.onclick = ()=>setZone(b.dataset.z));
$('layer').onchange = e=>setLayer(e.target.value);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick = ()=>{ activeTab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); renderRight(); });
document.querySelectorAll('#pf button').forEach(b=>b.onclick = ()=>{ palFilter = b.dataset.f; document.querySelectorAll('#pf button').forEach(x=>x.classList.toggle('on',x===b)); renderLeft(); });

// buscador: LDAP · bancada · pallet · inbound · seller
let qItems = [], qHi = 0;
function runSearch(){
  const q = $('q').value.trim().toLowerCase(); qItems = [];
  if(q){
    const mb = /^(?:wt-?|bancada\s*)?0*(\d{1,2})$/.exec(q); if(mb && IDX.has(+mb[1])) qItems.push({ic:'desk', t:`Bancada ${wt(+mb[1])}`, s:SEQ[IDX.get(+mb[1])].zone+' · ir a la bancada', a:()=>selectBench(+mb[1],true)});
    repsByB.forEach(r=>{ if(String(r.ldap).toLowerCase().includes(q) || r.uid.includes(q)) qItems.push({ic:'person', t:r.ldap, s:`Rep · ${wt(r.b)} · ${r.totes} totes/h`, a:()=>selectRep(r.b,true)}); });
    pallets.forEach(p=>{ if(String(p.id).toLowerCase().includes(q) || String(p.inbound).toLowerCase().includes(q) || String(p.seller).toLowerCase().includes(q)) qItems.push({ic:'box', t:String(p.id), s:`Pallet · ${p.bancada?wt(p.bancada):p.addr} · ${p.hrs.toFixed(1)}h · ${p.seller}`, a:()=>selectPallet(p.k,true)}); });
  }
  qItems = qItems.slice(0,9); qHi = 0;
  $('qres').innerHTML = q ? (qItems.length ? qItems.map((it,k)=>`<div class="it ${k===0?'hi':''}" data-k="${k}"><div class="tile">${ic(it.ic,16)}</div><div class="t"><b>${it.t}</b><small>${it.s}</small></div></div>`).join('') : '<div class="empty">Sin resultados · probá con un LDAP, "WT-05", un pallet o inbound</div>') : '';
  $('qres').classList.toggle('open', !!q);
}
function goSearch(k){ const it = qItems[k]; if(!it) return; $('qres').classList.remove('open'); $('q').value=''; $('q').blur(); it.a(); }
$('q').addEventListener('input', runSearch);
$('q').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ qHi = (qHi+(e.key==='ArrowDown'?1:-1)+qItems.length)%Math.max(1,qItems.length); document.querySelectorAll('#qres .it').forEach((n,i)=>n.classList.toggle('hi',i===qHi)); e.preventDefault(); }
  else if(e.key==='Enter') goSearch(qHi); else if(e.key==='Escape'){ $('q').value=''; $('qres').classList.remove('open'); $('q').blur(); }
});
$('qres').addEventListener('pointerdown', e=>{ const n = e.target.closest('.it'); if(n && n.dataset.k!=null) goSearch(+n.dataset.k); });
addEventListener('pointerdown', e=>{ if(!e.target.closest('.search')) $('qres').classList.remove('open'); });
addEventListener('keydown', e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='/'){ e.preventDefault(); $('q').focus(); } else if(e.key==='Escape') clearSel(); else if(e.key==='h'||e.key==='H') goHome();
});
// controles
function zoomBy(f){ const d = camera.position.clone().sub(controls.target).multiplyScalar(f); d.setLength(Math.min(controls.maxDistance, Math.max(controls.minDistance, d.length()))); flyTo(controls.target.clone().add(d), controls.target.clone(), .35); }
function orbitBy(a){ const d = camera.position.clone().sub(controls.target), c = Math.cos(a), s = Math.sin(a); flyTo(controls.target.clone().add(new THREE.Vector3(d.x*c-d.z*s, d.y, d.x*s+d.z*c)), controls.target.clone(), .5); }
function goHome(){ clearSel(); if(zoneSel!=='all'){ zoneSel = 'all'; document.querySelectorAll('#seg-zone button').forEach(b=>b.classList.toggle('on', b.dataset.z==='all')); renderPanels(); } homeView(); flyTo(HOME_POS.clone(), HOME_TGT.clone()); }
$('v-in').onclick = ()=>zoomBy(.7); $('v-out').onclick = ()=>zoomBy(1.4); $('v-rl').onclick = ()=>orbitBy(.6); $('v-rr').onclick = ()=>orbitBy(-.6); $('v-home').onclick = goHome;
// Vista de operario: ojo a 1.7 m, parado en la bancada mirando la mesa; cada click avanza 4 bancadas
let eyeI = -4;
$('v-eye').onclick = ()=>{ eyeI = (eyeI+4+N)%N; const x = bx(eyeI), b = SEQ[eyeI].id; flyTo(new THREE.Vector3(x-.2,1.7,2.0), new THREE.Vector3(x,1.0,-.6), 1.0); toast(`Vista de operario · ${wt(b)} (${SEQ[eyeI].zone}) · click otra vez para avanzar`); };
function togglePanel(id,btn){ const p = $(id), h = p.classList.toggle('hide'); $(btn).classList.toggle('on',!h); }
$('v-pl').onclick = ()=>togglePanel('pl','v-pl'); $('v-pr').onclick = ()=>togglePanel('pr','v-pr');
function applyTheme(name){
  themeName = name; store.set('skynet-theme',name); document.body.classList.toggle('dark', name==='dark'); const t = T();
  scene.background.set(t.bg); scene.fog.color.set(t.bg); scene.fog.near = t.fogN; scene.fog.far = t.fogF; hemi.color.set(t.hemiS); hemi.groundColor.set(t.hemiG); hemi.intensity = t.hemiI; sun.intensity = t.sun;
  ground.material.color.set(t.ground); slab.material.color.set(t.slab);
  $('v-theme').innerHTML = ic(name==='dark'?'sun':'moon');
}
$('v-theme').onclick = ()=>applyTheme(themeName==='dark'?'light':'dark');

// ══ BUCLE ══════════════════════════════════════════════════════════════════
const clock = new THREE.Clock(), cd = new THREE.Object3D();
function frame(){
  requestAnimationFrame(frame);
  const real = clock.getDelta(), dt = Math.min(.05,real), t = clock.elapsedTime;
  if(tween){ tween.t = Math.min(1, tween.t+real/tween.dur); const e = 1-Math.pow(1-tween.t,3); camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); if(tween.t>=1) tween = null; }
  // conveyor: cinta + totes avanzando hacia la Mezanina
  beltTex.offset.x -= dt*.7/1.2;
  for(let k=0;k<TOTE_N;k++){ cToteX[k] += dt*.7; if(cToteX[k]>CX1-.4) cToteX[k] = CX0+.4; cd.position.set(cToteX[k],1.0,Z_CONV); cd.scale.set(.6,.26,.4); cd.updateMatrix(); cTotes.setMatrixAt(k,cd.matrix); }
  cTotes.instanceMatrix.needsUpdate = true;
  // reps: escanean / acomodan según su estado
  repFigs.forEach(r=>{ const u = r.g.userData, s = repStatus(r), sp = s==='ok'?5:s==='low'?2.5:.8, amp = s==='ok'?.28:s==='low'?.16:.03;
    u.arms[0].rotation.x = -1.15 + Math.sin(t*sp+r.ph)*amp; u.arms[1].rotation.x = -1.15 + Math.sin(t*sp+r.ph+1.6)*amp; r.g.position.y = Math.abs(Math.sin(t*sp*.5+r.ph))*(s==='ok'?.015:0); });
  if(sel){ let x=null,z=Z_REP; if(sel.type==='rep'||sel.type==='bench'){ x = bx(IDX.get(sel.b)); } else if(sel.type==='pal'){ const it = palItems.find(i=>i.p===pallets[sel.k]); if(it){ x = it.x; z = it.z; } else if(pallets[sel.k].bancada){ x = bx(IDX.get(pallets[sel.k].bancada)); } }
    if(x!=null){ selRing.visible = selArrow.visible = true; selRing.position.set(x,.06,z); selArrow.position.set(x,3.0+Math.sin(t*6)*.2,z); selRing.rotation.z = t*2; } }
  controls.update(); renderer.render(scene,camera);
}

// ══ ARRANQUE + REFRESCO ════════════════════════════════════════════════════
const fullRefresh = () => { rebuildDynamic(); renderPanels(); };
async function boot(){ await loadAll(); pallets.forEach((p,k)=>p.k=k); fullRefresh(); }
applyTheme(themeName);
boot().then(()=>{ setTimeout(()=>$('loading').classList.add('done'), 300); });
setInterval(async ()=>{ const keep = sel; await loadAll(); pallets.forEach((p,k)=>p.k=k); fullRefresh(); if(keep){ if(keep.type==='rep') selectRep(keep.b,false); else if(keep.type==='bench') selectBench(keep.b,false); } }, REFRESH_MS);
window.__ck = {scene,camera,controls,tiles,SEQ,get reps(){return repFigs},get pallets(){return pallets},selectBench,selectRep,selectPallet,setZone,setLayer,goHome,isDemoRef:()=>isDemo};
frame();
