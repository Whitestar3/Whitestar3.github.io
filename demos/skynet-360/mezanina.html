<html lang="es">

<script>
/* Si algo falla al iniciar, se muestra el motivo en pantalla (en vez de quedar en blanco) */
window.addEventListener('error', function(e){
  var l = document.getElementById('loading'); if(!l) return;
  l.classList.remove('done'); l.querySelector('div').innerHTML = '<b style="color:#f87171">No se pudo iniciar la Mezanina</b><span style="max-width:560px;text-align:center;line-height:1.5">'+(e.message||'error')+'<br><small>'+(e.filename||'').split('/').pop()+':'+(e.lineno||'')+'</small></span>';
});
</script>
<style>
  :root{--bg:#e8eef7;--card:rgba(255,255,255,.95);--cardb:#e1e8f2;--txt:#0f1b2d;--mut:#64748b;--acc:#2563eb;--accbg:#e8efff;
        --ok:#15803d;--okbg:#e4f6ea;--warn:#b45309;--warnbg:#fdf0d8;--bad:#b91c1c;--badbg:#fde7e7;--burn:#6d28d9;--burnbg:#ede9fe;--chip:#f1f5fb;--line:#e8eef6;
        --shadow:0 12px 32px rgba(30,60,120,.15),0 1px 3px rgba(30,60,120,.08)}
  body.dark{--bg:#0a0f18;--card:rgba(15,23,35,.94);--cardb:rgba(255,255,255,.08);--txt:#e6edf3;--mut:#8b9aab;--acc:#6ea0ff;--accbg:rgba(110,160,255,.16);
        --ok:#4ade80;--okbg:rgba(34,197,94,.16);--warn:#fbbf24;--warnbg:rgba(245,158,11,.16);--bad:#f87171;--badbg:rgba(239,68,68,.18);--burn:#c4b5fd;--burnbg:rgba(139,92,246,.2);--chip:rgba(255,255,255,.05);--line:rgba(255,255,255,.07);
        --shadow:0 12px 32px rgba(0,0,0,.5)}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,sans-serif}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);user-select:none;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button,input,select{font:inherit;color:inherit;border:0;background:none;outline:none}
  button{cursor:pointer}svg{display:block}
  .card{background:var(--card);border:1px solid var(--cardb);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
  small{color:var(--mut);font-size:.68rem}

  /* ── barra superior (una sola línea) ── */
  #top{position:fixed;top:10px;left:14px;right:14px;height:52px;z-index:30;display:flex;align-items:center;gap:9px;padding:0 10px 0 8px;border-radius:14px}
  .logo{display:flex;align-items:center;gap:9px;padding-right:4px;white-space:nowrap}
  .logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center}
  .logo b{font-size:.95rem;letter-spacing:.3px;display:block;line-height:1.05}.logo small{display:block;font-size:.6rem}
  .seg{display:flex;gap:3px;background:var(--chip);padding:3px;border-radius:10px;border:1px solid var(--cardb)}
  .seg button{padding:5px 11px;font-size:.74rem;font-weight:700;border-radius:8px;color:var(--mut);white-space:nowrap;transition:.15s}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:var(--acc);color:#fff}
  .seg button.on.put{background:var(--warnbg);color:var(--warn)}.seg button.on.pick{background:var(--accbg);color:var(--acc)}
  .sel{height:36px;padding:0 8px;border-radius:10px;background:var(--chip);border:1px solid var(--cardb);font-size:.74rem;font-weight:600;max-width:170px}
  .sel option{color:#000}
  .search{position:relative;flex:0 1 230px;min-width:130px}
  .search .box{display:flex;align-items:center;gap:7px;height:36px;padding:0 10px;border:1px solid var(--cardb);border-radius:10px;background:var(--chip);color:var(--mut)}
  .search input{flex:1;font-size:.77rem;color:var(--txt);user-select:text;min-width:0}.search input::placeholder{color:var(--mut)}
  .pop{position:absolute;top:44px;left:0;right:0;border-radius:14px;padding:6px;display:none;max-height:340px;overflow:auto;z-index:40}
  .pop.open{display:block}
  .pop .it{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:.78rem}
  .pop .it:hover,.pop .it.hi{background:var(--accbg)}
  .pop .it .t{flex:1;min-width:0}.pop .it .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pop .empty{padding:14px;text-align:center;color:var(--mut);font-size:.76rem}
  .tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accbg);color:var(--acc)}
  .chips{display:flex;gap:6px}
  .chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 9px;border-radius:10px;background:var(--chip);border:1px solid var(--cardb);white-space:nowrap}
  .chip svg{color:var(--acc)}.chip b{font-size:.92rem;font-variant-numeric:tabular-nums;line-height:1}
  .chip.bad svg,.chip.bad b{color:var(--bad)}
  .sp{flex:1}
  .live{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:999px;background:var(--okbg);color:var(--ok);font-weight:600;font-size:.72rem;white-space:nowrap}
  .live.demo{background:var(--warnbg);color:var(--warn)}
  .live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ── controles verticales ── */
  #vctl{position:fixed;top:72px;right:14px;z-index:25;width:44px;padding:4px;display:flex;flex-direction:column;gap:1px;border-radius:13px}
  .ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut);position:relative}
  .ibtn:hover{background:var(--chip);color:var(--txt)}.ibtn.on{background:var(--accbg);color:var(--acc)}
  #vctl hr{border:0;border-top:1px solid var(--line);margin:3px 2px}

  /* ── paneles ── */
  .panel{position:fixed;top:72px;bottom:14px;z-index:20;padding:11px;display:flex;flex-direction:column;gap:8px;overflow:hidden;transition:transform .25s,opacity .25s}
  #pl{left:14px;width:282px}#pr{right:66px;width:268px}
  #pl.hide{transform:translateX(-320px);opacity:0;pointer-events:none}#pr.hide{transform:translateX(320px);opacity:0;pointer-events:none}
  .ph{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .ph b{font-size:.8rem;letter-spacing:.2px}.ph small{display:block;margin-top:1px}
  .plist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px;min-height:0}
  .plist::-webkit-scrollbar{width:5px}.plist::-webkit-scrollbar-thumb{background:var(--cardb);border-radius:3px}
  .it2{background:var(--chip);border:1px solid var(--cardb);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.15s}
  .it2:hover{border-color:var(--acc);transform:translateX(2px)}
  .it2 .r1{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.74rem;font-weight:700}
  .it2 .r2{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.64rem;color:var(--mut)}
  .it2.c-ok{border-left:3px solid #22c55e}.it2.c-warn{border-left:3px solid #f59e0b}.it2.c-bad{border-left:3px solid #ef4444}.it2.c-burn{border-left:3px solid #8b5cf6}
  .pill{display:inline-flex;align-items:center;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.burn{background:var(--burnbg);color:var(--burn)}.pill.info{background:var(--accbg);color:var(--acc)}.pill.mut{background:var(--chip);color:var(--mut)}
  .mono{font-family:Consolas,monospace}
  .zc{background:var(--chip);border:1px solid var(--cardb);border-radius:11px;padding:7px 9px}
  .zc .zh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:.7rem;font-weight:800}
  .zc .zb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
  .zc .zb b{display:block;font-size:.86rem;line-height:1}.zc .zb small{font-size:.5rem;text-transform:uppercase}
  .tabs{display:flex;gap:3px;background:var(--chip);padding:3px;border-radius:9px;border:1px solid var(--cardb)}
  .tabs button{flex:1;padding:4px 6px;font-size:.68rem;font-weight:700;border-radius:7px;color:var(--mut)}
  .tabs button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .sech{font-size:.6rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding:5px 2px 1px}
  .cpt{background:var(--chip);border:1px solid var(--cardb);border-radius:11px;padding:8px 10px}
  .cpt.urgent{border-color:#ef4444}.cpt.warning{border-color:#f59e0b}
  .cpt .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
  .cpt .h b{font-size:.78rem}.cpt .h .cd{font-family:Consolas,monospace;font-weight:800;font-size:.86rem}
  .bar{height:5px;border-radius:3px;background:var(--cardb);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}

  /* ── ficha de información ── */
  #info{position:fixed;bottom:14px;left:310px;width:292px;z-index:26;padding:11px 12px;display:none}
  #info .ih{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  #info .tt{flex:1;min-width:0}
  #info .eyebrow{font-size:.58rem;font-weight:700;letter-spacing:.6px;color:var(--acc);text-transform:uppercase}
  #info b.title{display:block;font-size:.92rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #info .ibtn{width:26px;height:26px;border-radius:8px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:.72rem}
  .kv span{color:var(--mut)}.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  #tip{position:fixed;z-index:60;pointer-events:none;display:none;background:var(--card);border:1px solid var(--cardb);box-shadow:var(--shadow);border-radius:9px;padding:5px 10px;font-size:.72rem;font-weight:600;line-height:1.35}
  #tip small{display:block;font-weight:500}
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:70;background:var(--txt);color:var(--bg);padding:9px 16px;border-radius:11px;font-size:.78rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #loading{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;transition:opacity .6s}
  #loading.done{opacity:0;pointer-events:none}
  #loading div{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mut);font-size:.8rem}
  #loading i{width:34px;height:34px;border-radius:50%;border:3px solid var(--cardb);border-top-color:var(--acc);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:1500px){ .chips .chip:nth-child(3){display:none} }
  @media (max-width:1320px){ .chips{display:none} .logo small{display:none} }
  @media (max-width:1100px){ #pr{display:none} .sel{display:none} }
  @media (max-width:860px){ #pl{display:none} #info{left:14px;width:calc(100vw - 28px)} .search{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div><i></i><span id="loadtxt">Cargando Mezanina CD-01…</span></div></div>

<header id="top" class="card">
  <div class="logo"><div class="mark" data-ic="cube" data-sz="19"></div><div><b>SKYNET</b><small>Mezanina · CD-01</small></div></div>
  <div class="seg" id="seg-proc"><button class="on put" data-p="PUTAWAY">📦 Putaway</button><button data-p="PICKING">🛒 Picking</button></div>
  <div class="seg" id="seg-floor"><button class="on" data-f="all">Todos</button><button data-f="0">MZ-0</button><button data-f="1">MZ-1</button><button data-f="2">MZ-2</button><button data-f="3">MZ-3</button></div>
  <select class="sel" id="layer" title="Capa del mapa">
    <option value="default">🎨 Capa: Estándar</option>
    <option value="saturacion">🔥 Capa: Ocupación (binfull)</option>
    <option value="sla">⏱ Capa: SLA / CPT</option>
    <option value="tool">🗺 Capa: Putaway Tool</option>
  </select>
  <div class="search"><div class="box"><span data-ic="search" data-sz="15"></span><input id="q" autocomplete="off" placeholder="LDAP, calle (C04) o tote…"/></div><div id="qres" class="pop card"></div></div>
  <div class="chips">
    <div class="chip" title="Reps del proceso activo"><span data-ic="users" data-sz="16"></span><b id="k1">0</b><small>Reps</small></div>
    <div class="chip" title="Totes pendientes de putaway"><span data-ic="box" data-sz="16"></span><b id="k2">0</b><small>Totes</small></div>
    <div class="chip bad" title="Críticos: SLA rojo o quemado / CPT en riesgo"><span data-ic="warn" data-sz="16"></span><b id="k3">0</b><small>Críticos</small></div>
  </div>
  <div class="sp"></div>
  <div class="live demo" id="live"><i></i><span id="livetxt">Demo</span></div>
</header>

<nav id="vctl" class="card">
  <button class="ibtn" id="v-in" title="Acercar"><span data-ic="plus"></span></button>
  <button class="ibtn" id="v-out" title="Alejar"><span data-ic="minus"></span></button>
  <button class="ibtn" id="v-rl" title="Girar izquierda"><span data-ic="rotl"></span></button>
  <button class="ibtn" id="v-rr" title="Girar derecha"><span data-ic="rotr"></span></button>
  <button class="ibtn" id="v-home" title="Vista general (H)"><span data-ic="home"></span></button>
  <button class="ibtn" id="v-eye" title="Vista de operario: recorrer el pasillo central"><span data-ic="eye"></span></button>
  <hr/>
  <button class="ibtn on" id="v-pl" title="Panel izquierdo"><span data-ic="sideL"></span></button>
  <button class="ibtn on" id="v-pr" title="Panel derecho"><span data-ic="sideR"></span></button>
  <button class="ibtn" id="v-theme" title="Claro / oscuro"><span data-ic="sun"></span></button>
</nav>

<aside id="pl" class="panel card">
  <div class="ph"><div><b id="pl-title">⏱ SLA Putaway</b><small id="pl-sub">menor tiempo restante primero</small></div><span class="pill info" id="pl-count">0</span></div>
  <div class="plist" id="pl-list"></div>
</aside>

<aside id="pr" class="panel card">
  <div class="ph"><div><b>📦 Totes pendientes</b><small>por zona · antigüedad</small></div></div>
  <div id="zcards" style="display:flex;flex-direction:column;gap:6px"></div>
  <div class="tabs" id="tabs"><button class="on" data-t="reps">👷 Reps</button><button data-t="sec" id="tab-sec">⏱ SLA</button></div>
  <div class="plist" id="pr-list"></div>
</aside>

<aside id="info" class="card">
  <div class="ih"><div class="tile" id="i-ic"></div><div class="tt"><div class="eyebrow" id="i-eye"></div><b class="title" id="i-title"></b></div><button class="ibtn" id="i-x" title="Cerrar (Esc)"><span data-ic="close" data-sz="14"></span></button></div>
  <div id="i-body"></div>
</aside>
<div id="tip"></div><div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   SKYNET · MEZANINA COMPLETA (Putaway + Picking) — CD-01
   · Geometría real (CAD): rack 1.098 m de fondo · pasillo 1.372 m · módulo 2.33 m · pasillo central 6 m · 70 calles × 40 módulos × 4 pisos
   · Datos: datasets publicados por n8n (mismos que PUTAWAY-PICKING-3D-CD-01). Si no se pueden leer, entra el modo DEMO con el mismo formato.
   ════════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a), pick = a => a[Math.floor(Math.random()*a.length)], pad2 = n => String(n).padStart(2,'0');

// ══ CONFIG ═════════════════════════════════════════════════════════════════
const DATA_DOC_ID = 'YOUR_DOCUMENT_ID';     // ← fuente de datos donde tu n8n publica los datasets de la Mezanina (cambialo si usás otro)
const GRID_BASE   = 'https://YOUR_DATA_HOST';
const DS = { reps:'reps_putaway', totes:'totes_putaway', binfull:'binfullness_cd01', pickReps:'reps_picking', pickDetail:'reps_picking_detail', zpts:'zpts_picking', tool:'putaway_tool' };
const REFRESH_MS = 120000;
const GEO = { calles:70, modsA:20, modsB:20, rackD:1.098, aisle:1.372, modL:2.33, central:6.0, rackH:2.5, floorGap:4.0 };
const STEP = GEO.rackD + GEO.aisle;                        // 2.47 m por calle
const LADO_A_Z0 = 1.2, AISLE_Z = LADO_A_Z0 + GEO.modsA*GEO.modL, BL_Z = AISLE_Z + GEO.central/2, LADO_B_Z0 = AISLE_Z + GEO.central;
const TOTAL_DEPTH = LADO_B_Z0 + GEO.modsB*GEO.modL + 1.2, TOTAL_WIDTH = GEO.calles*STEP + GEO.rackD;
const ML = [0.45, 0.45+GEO.floorGap, 0.45+2*GEO.floorGap, 0.45+3*GEO.floorGap];       // altura de cada piso
const ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', rotl:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>', rotr:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  sideL:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>', sideR:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>', moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-4 3.5-5.5 6.5-5.5s5.8 1.5 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .6 3.2 2.3 3.5 5.2"/>',
  box:'<path d="M12 3l9 4.5v9L12 21l-9-4.5v-9L12 3z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/>', cube:'<path d="M12 3l9 4.5v9L12 21l-9-4.5v-9L12 3z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>', warn:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/>', person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-6 8-6s7 1 8 6"/>', pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'
};
const ic = (k,sz=18) => `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||''}</svg>`;
document.querySelectorAll('[data-ic]').forEach(e=>{ e.innerHTML = ic(e.dataset.ic, +(e.dataset.sz||18)); });
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

// ══ TEMA ═══════════════════════════════════════════════════════════════════
const THEMES = {
  light:{bg:0xe8eef7, fogN:420, fogF:1100, ground:0xdbe4f0, slab:0xb9c6da, slab0:0xc9d3e3, beam:0x2563eb, aisle:0xaab6c8, hemiS:0xffffff, hemiG:0xaebdd2, hemiI:1.0, sun:.8},
  dark: {bg:0x080c14, fogN:360, fogF:950,  ground:0x0b0f1a, slab:0x1c2742, slab0:0x121a2e, beam:0x1d4ed8, aisle:0x0e1424, hemiS:0xcfe0ff, hemiG:0x182030, hemiI:.95, sun:.9}
};
let themeName = store.get('skynet-theme') || 'dark';
const T = () => THEMES[themeName];

async function loadGrid(name){

    if(!meta.ok) return null;
    const m = await meta.json(); if(!m.download_url) return null;

// ubicación tipo "MZ-01-10-20" → piso 1, calle 10, módulo 20 (igual que en el original)
function parseUbi(r){
  let piso=null, calle=null, modulo=null;
  const ubi = String(r.UBICACION_PENDIENTE || r.ULTIMA_UBICACION || r.ULTIMA_UBI || r.UBICACION || '').trim().toUpperCase();
  const nums = ubi.match(/\d+/g);
  if(nums && nums.length>=3){ piso=+nums[0]; calle=+nums[1]; modulo=+nums[2]; } else if(nums && nums.length===2){ calle=+nums[0]; modulo=+nums[1]; }
  if(piso===null && nz(r.PISO)!=null){ const p = parseInt(String(r.PISO).replace(/\D/g,''),10); if(!isNaN(p)) piso=p; }
  if(calle===null && (r.CALLE||r.PASILLO)){ const c = parseInt(String(r.CALLE||r.PASILLO).replace(/\D/g,''),10); if(!isNaN(c)) calle=c; }
  if(modulo===null && r.MODULO){ const m = parseInt(String(r.MODULO).replace(/\D/g,''),10); if(!isNaN(m)) modulo=m; }
  if(calle===null || isNaN(calle) || calle<1 || calle>GEO.calles) calle=null;
  if(modulo===null || isNaN(modulo) || modulo<1) modulo=1; if(modulo>GEO.modsA+GEO.modsB) modulo=GEO.modsA+GEO.modsB;
  if(piso===null || isNaN(piso) || piso<0 || piso>3) piso = (piso>3?3:0);
  return {piso, calle, modulo};
}
const bucketOf = s => { s=(s||'VERDE').toUpperCase(); return s==='VERDE'?'green':s==='AMARILLO'?'yellow':s==='ROJO'?'red':'burnt'; };
function computeStats(){
  const z = {'MZ-0':{green:0,yellow:0,red:0,burnt:0},'GM':{green:0,yellow:0,red:0,burnt:0},'HV':{green:0,yellow:0,red:0,burnt:0}};
  allTotes.forEach(r=>{ const zn = String(r.ZONA_ESTIMADA||''), b = bucketOf(r.SEMAFORO_PUTAWAY);
    (zn.includes('MZ-0') ? z['MZ-0'] : zn.includes('HV') ? z['HV'] : z['GM'])[b]++; });
  zoneStats = z;
}
function ingest(d){
  allReps = (d.reps||[]).map(r=>({...r, ...parseUbi(r), kind:'PUTAWAY'}));
  allPickReps = (d.pickReps||[]).map(r=>({...r, ...parseUbi(r), kind:'PICKING'}));
  allPickDetail = d.pickDetail||[]; allTotes = d.totes||[]; allZPTs = d.zpts||[]; allTool = d.tool||[];
  binfull = new Map(); (d.binfull||[]).forEach(r=>{ const c = parseInt(r.CALLE)||0; if(c) binfull.set(`${String(r.AREA||'MZ').toUpperCase()}-${parseInt(r.PISO)||0}-${c}`, r); });
  computeStats(); dataAt = new Date();
}

class SimpleOrbit {
  constructor(camera, dom){
    this.camera = camera; this.dom = dom; this.target = new THREE.Vector3();
    this.minDistance = 4; this.maxDistance = 700; this.minPolarAngle = .04; this.maxPolarAngle = Math.PI*.495; this.enableDamping = true;
    this.dTheta = 0; this.dPhi = 0; this.dZoom = 0; this.pan = new THREE.Vector3(); this.ptrs = new Map(); this.pinch = 0; this.moved = 0;
    dom.style.touchAction = 'none'; dom.addEventListener('contextmenu', e=>e.preventDefault());
    dom.addEventListener('pointerdown', e=>{ try{ dom.setPointerCapture(e.pointerId); }catch(_){} this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); this.pinch = this._pd(); this.moved = 0; });
    dom.addEventListener('pointermove', e=>{
      const p = this.ptrs.get(e.pointerId); if(!p) return;
      const dx = e.clientX-p.x, dy = e.clientY-p.y; p.x = e.clientX; p.y = e.clientY; this.moved += Math.abs(dx)+Math.abs(dy);
      if(this.ptrs.size===1){ if(e.buttons&2 || e.shiftKey || e.ctrlKey) this._panBy(dx,dy); else { const h = Math.max(1,dom.clientHeight); this.dTheta -= 2*Math.PI*dx/h; this.dPhi -= 2*Math.PI*dy/h; } }
      else if(this.ptrs.size===2){ const d = this._pd(); if(this.pinch) this.dZoom += (this.pinch-d)*.006; this.pinch = d; }
    });
    const up = e=>{ this.ptrs.delete(e.pointerId); this.pinch = 0; };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('wheel', e=>{ e.preventDefault(); this.dZoom += Math.sign(e.deltaY)*.14; }, {passive:false});
  }
  _pd(){ if(this.ptrs.size<2) return 0; const [a,b] = [...this.ptrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y); }
  _panBy(dx,dy){
    const cam = this.camera, k = 2*cam.position.distanceTo(this.target)*Math.tan(cam.fov*Math.PI/360)/Math.max(1,this.dom.clientHeight);
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrix,0); right.y = 0; right.normalize();
    const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    this.pan.addScaledVector(right,-dx*k).addScaledVector(fwd,dy*k);
  }
  update(){
    const off = this.camera.position.clone().sub(this.target), s = new THREE.Spherical().setFromVector3(off), k = this.enableDamping ? .2 : 1;
    s.theta += this.dTheta*k; s.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, s.phi + this.dPhi*k));
    s.radius = Math.max(this.minDistance, Math.min(this.maxDistance, s.radius*(1+this.dZoom*k)));
    this.target.addScaledVector(this.pan,k); this.dTheta *= 1-k; this.dPhi *= 1-k; this.dZoom *= 1-k; this.pan.multiplyScalar(1-k);
    off.setFromSpherical(s); this.camera.position.copy(this.target).add(off); this.camera.lookAt(this.target);
  }
}

function crateTexture(){
  const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S; const g = cv.getContext('2d');
  g.fillStyle = '#101c36'; g.fillRect(0,0,S,S);
  let seed = 7; const r = () => (seed = (seed*16807)%2147483647)/2147483647;
  for(let l=0;l<4;l++){
    const y0 = l*64;
    g.fillStyle = '#e8860b'; g.fillRect(0,y0+58,S,6);                               // larguero naranja
    for(let i=0;i<3;i++){
      const x0 = 10 + i*79; if(r()<.12) continue;                                   // algún hueco vacío
      g.fillStyle = '#f7c81e'; g.fillRect(x0,y0+9,70,46);
      g.fillStyle = '#d9a40a'; g.fillRect(x0,y0+40,70,15);
      g.fillStyle = '#8a5a05'; g.fillRect(x0+18,y0+14,34,6);                         // asa
      g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(x0,y0+9,70,3);
    }
  }
  g.fillStyle = '#1d4ed8'; g.fillRect(0,0,7,S); g.fillRect(S-7,0,7,S); g.fillRect(S/2-3,0,6,S);   // parantes azules
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; t.minFilter = THREE.LinearMipmapLinearFilter; return t;
}

function applyLayer(){
  const mx = new Map(); // piso → mapa calle→row (tool)
  const slaFloor = { 0: worstBucket(allTotes.filter(r=>String(r.ZONA_ESTIMADA||'').includes('MZ-0'))), 1: worstBucket(allTotes.filter(r=>/MZ-[123]|GM/.test(String(r.ZONA_ESTIMADA||''))&&!String(r.ZONA_ESTIMADA).includes('HV'))), 2:null, 3:null };

      else if(layer==='sla'){ const b = currentProcess==='PICKING' ? cptWorst : (f.pi===3 && it.c<=20 && it.m>GEO.modsA ? worstBucket(allTotes.filter(r=>String(r.ZONA_ESTIMADA||'').includes('HV'))) : slaFloor[f.pi]); col.setHex(b ? BCOL[b] : 0x8896b3); }

function selectTote(id){
  const t = allTotes.find(x=>x.TOTE_ID===id); if(!t) return; sel = {type:'tote', ref:t}; const b = bucketOf(t.SEMAFORO_PUTAWAY);
  showInfo('Tote pendiente de putaway', t.TOTE_ID, 'box', kv('Estado',`<span class="pill ${cls(b)}">${t.SEMAFORO_PUTAWAY||'—'}</span>`)+kv('Esperando',(parseFloat(t.HORAS_ESPERANDO)||0).toFixed(1)+' h')+kv('Zona estimada',t.ZONA_ESTIMADA||'—')+kv('Familias',String(t.FAMILIAS||'—').replace(/ \| /g,' · '))+kv('Seller / inbound',(t.SELLER_ID||'—')+' · '+(t.INBOUND_ID||'—'))+kv('Último operario',t.ULTIMO_OPERARIO||'—')+kv('DCI',(t.ES_DCI===true||t.ES_DCI==='true')?'Sí':'No'));
  const piso = t.PISO_DESTINO!=null ? parseInt(t.PISO_DESTINO) : (String(t.ZONA_ESTIMADA||'').includes('MZ-0')?0:1); if(!isNaN(piso)) setFloor(Math.max(0,Math.min(3,piso)));
}
function selectModule(it, pi){
  sel = {type:'mod', ref:it}; const bf = bfPct(pi,it.c), reps = [...allReps,...allPickReps].filter(r=>r.piso===pi && r.calle===it.c);
  showInfo('Módulo', `MZ-${pi} · C${pad2(it.c)} · M${pad2(it.m)}`, 'pin', kv('Lado', it.m<=GEO.modsA?'A (módulos 1-20)':'B (módulos 21-40)')+kv('Ocupación (binfull)', bf===null?'—':bf.toFixed(0)+'%')+kv('Reps en la calle', reps.length ? reps.map(repLdap).join(', ') : 'ninguno')+kv('Medidas',`${(GEO.modL).toFixed(2)} × ${GEO.rackD.toFixed(2)} m`));
}
function focusCalle(c){
  c = Math.max(1,Math.min(GEO.calles,c)); const pi = currentFloor==='all'?0:currentFloor, fy = ML[pi];
  flyTo(new THREE.Vector3(aisleX(c)-14, fy+16, BL_Z+26), new THREE.Vector3(aisleX(c), fy+1.5, BL_Z-4));
  showInfo('Calle', `C${pad2(c)}`, 'pin', kv('Reps ahora', [...allReps,...allPickReps].filter(r=>r.calle===c).map(repLdap).join(', ')||'ninguno')+kv('Ocupación MZ-'+pi, bfPct(pi,c)===null?'—':bfPct(pi,c).toFixed(0)+'%')+kv('Putaway Tool', toolCalles(pi).has(c)?'Asignada':'—')); sel = {type:'calle', ref:c};
}

// ══ INTERACCIÓN ════════════════════════════════════════════════════════════
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
function pickAt(ev){
  mouse.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hr = ray.intersectObjects(pickables.filter(m=>m.parent && m.parent.visible), false)[0];
  const racks = floors.filter(f=>f.g.visible).map(f=>f.rack), hm = ray.intersectObjects(racks, false)[0];
  if(hr && (!hm || hr.distance <= hm.distance+.5)) return {type:'rep', ref:hr.object.userData.rep};
  if(hm){ const f = floors.find(f=>f.rack===hm.object), it = f.items[hm.instanceId]; return {type:'mod', ref:it, piso:f.pi}; }
  return null;
}
canvas.addEventListener('pointermove', ev=>{
  const p = pickAt(ev); tip.style.display = 'none';
  if(p){ tip.innerHTML = p.type==='rep' ? `${repLdap(p.ref)}<small>${p.ref.kind==='PICKING'?'Picker':'Putaway'} · MZ-${p.ref.piso} C${pad2(p.ref.calle)} M${pad2(p.ref.modulo)}</small>` : `MZ-${p.piso} · C${pad2(p.ref.c)} · M${pad2(p.ref.m)}<small>${bfPct(p.piso,p.ref.c)===null?'sin dato de ocupación':'ocupación '+bfPct(p.piso,p.ref.c).toFixed(0)+'%'}</small>`;
    tip.style.display = 'block'; tip.style.left = (ev.clientX+14)+'px'; tip.style.top = (ev.clientY+14)+'px'; }
  canvas.style.cursor = p ? 'pointer' : 'default';
});
let downAt = null; canvas.addEventListener('pointerdown', ev=>{ downAt = {x:ev.clientX,y:ev.clientY}; });
canvas.addEventListener('pointerup', ev=>{
  if(!downAt || Math.hypot(ev.clientX-downAt.x, ev.clientY-downAt.y)>5) return;
  const p = pickAt(ev); if(!p){ clearSel(); return; }
  if(p.type==='rep') selectRep(p.ref,false); else selectModule(p.ref,p.piso);
});
// delegación de clicks en las listas de los paneles
function act(s){
  const [k,a,b] = s.split(':');
  if(k==='rep'){ const r = (a==='PICKING'?allPickReps:allReps)[+b]; if(r && r.g) selectRep(r,true); }
  else if(k==='tote') selectTote(s.slice(5));
  else if(k==='calle') focusCalle(+a);
}
['pl-list','pr-list'].forEach(id=>$(id).addEventListener('pointerdown', e=>{ const n = e.target.closest('[data-act]'); if(n) act(n.dataset.act); }));
// cabecera
document.querySelectorAll('#seg-proc button').forEach(b=>b.onclick = ()=>setProcess(b.dataset.p));
document.querySelectorAll('#seg-floor button').forEach(b=>b.onclick = ()=>setFloor(b.dataset.f==='all'?'all':+b.dataset.f));
$('layer').onchange = e=>setLayer(e.target.value);
document.querySelectorAll('#tabs button').forEach(b=>b.onclick = ()=>{ activeTab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); renderRight(); });
// buscador: LDAP · calle · tote
let qItems = [], qHi = 0;
function runSearch(){
  const q = $('q').value.trim().toLowerCase(); qItems = [];
  if(q){
    const mc = /^c(?:alle)?\s*0*(\d{1,2})$/.exec(q) || /^0*(\d{1,2})$/.exec(q); if(mc && +mc[1]>=1 && +mc[1]<=GEO.calles) qItems.push({ic:'pin', t:`Calle C${pad2(+mc[1])}`, s:'Ir a la calle', a:()=>focusCalle(+mc[1])});
    [...allReps,...allPickReps].forEach(r=>{ if(r.g && (String(repLdap(r)).toLowerCase().includes(q) || String(r.OPERARIO_USER_ID||r.PICKER_ID||'').toLowerCase().includes(q))) qItems.push({ic:'person', t:String(repLdap(r)), s:`${r.kind==='PICKING'?'Picker':'Rep putaway'} · MZ-${r.piso} C${pad2(r.calle)} M${pad2(r.modulo)}`, a:()=>selectRep(r,true)}); });
    allTotes.forEach(t=>{ if(String(t.TOTE_ID||'').toLowerCase().includes(q)) qItems.push({ic:'box', t:t.TOTE_ID, s:`Tote · ${t.ZONA_ESTIMADA||''} · ${(parseFloat(t.HORAS_ESPERANDO)||0).toFixed(1)}h`, a:()=>selectTote(t.TOTE_ID)}); });
  }
  qItems = qItems.slice(0,9); qHi = 0;
  $('qres').innerHTML = q ? (qItems.length ? qItems.map((it,k)=>`<div class="it ${k===0?'hi':''}" data-k="${k}"><div class="tile">${ic(it.ic,16)}</div><div class="t"><b>${it.t}</b><small>${it.s}</small></div></div>`).join('') : '<div class="empty">Sin resultados · probá con un LDAP, "C04" o un tote</div>') : '';
  $('qres').classList.toggle('open', !!q);
}
function goSearch(k){ const it = qItems[k]; if(!it) return; $('qres').classList.remove('open'); $('q').value=''; $('q').blur(); it.a(); }
$('q').addEventListener('input', runSearch);
$('q').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ qHi = (qHi+(e.key==='ArrowDown'?1:-1)+qItems.length)%Math.max(1,qItems.length); document.querySelectorAll('#qres .it').forEach((n,i)=>n.classList.toggle('hi',i===qHi)); e.preventDefault(); }
  else if(e.key==='Enter') goSearch(qHi); else if(e.key==='Escape'){ $('q').value=''; $('qres').classList.remove('open'); $('q').blur(); }
});
$('qres').addEventListener('pointerdown', e=>{ const n = e.target.closest('.it'); if(n && n.dataset.k!=null) goSearch(+n.dataset.k); });
addEventListener('pointerdown', e=>{ if(!e.target.closest('.search')) $('qres').classList.remove('open'); });
addEventListener('keydown', e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='/'){ e.preventDefault(); $('q').focus(); } else if(e.key==='Escape') clearSel(); else if(e.key==='h'||e.key==='H') goHome();
});
// controles
function zoomBy(f){ const d = camera.position.clone().sub(controls.target).multiplyScalar(f); d.setLength(Math.min(controls.maxDistance, Math.max(controls.minDistance, d.length()))); flyTo(controls.target.clone().add(d), controls.target.clone(), .35); }
function orbitBy(a){ const d = camera.position.clone().sub(controls.target), c = Math.cos(a), s = Math.sin(a); flyTo(controls.target.clone().add(new THREE.Vector3(d.x*c-d.z*s, d.y, d.x*s+d.z*c)), controls.target.clone(), .5); }
function goHome(){ clearSel(); homeView(); flyTo(HOME_POS.clone(), HOME_TGT.clone()); }
$('v-in').onclick = ()=>zoomBy(.7); $('v-out').onclick = ()=>zoomBy(1.4); $('v-rl').onclick = ()=>orbitBy(.6); $('v-rr').onclick = ()=>orbitBy(-.6); $('v-home').onclick = goHome;
// Vista de operario: ojo a 1.7 m recorriendo el pasillo central (como en las fotos)
let eyeX = 6;
$('v-eye').onclick = ()=>{ const pi = currentFloor==='all'?0:currentFloor, fy = ML[pi]; eyeX = eyeX>TOTAL_WIDTH-60 ? 6 : Math.min(TOTAL_WIDTH-40, controls.target.x>20 && controls.target.y<fy+3 ? controls.target.x+40 : 6);
  flyTo(new THREE.Vector3(eyeX, fy+1.75, BL_Z), new THREE.Vector3(eyeX+60, fy+1.9, BL_Z), 1.2); toast('Vista de operario · click otra vez para avanzar por el pasillo central'); };
function togglePanel(id,btn){ const p = $(id), h = p.classList.toggle('hide'); $(btn).classList.toggle('on',!h); }
$('v-pl').onclick = ()=>togglePanel('pl','v-pl'); $('v-pr').onclick = ()=>togglePanel('pr','v-pr');
function applyTheme(name){
  themeName = name; store.set('skynet-theme',name); document.body.classList.toggle('dark', name==='dark'); const t = T();
  scene.background.set(t.bg); scene.fog.color.set(t.bg); scene.fog.near = t.fogN; scene.fog.far = t.fogF; hemi.color.set(t.hemiS); hemi.groundColor.set(t.hemiG); hemi.intensity = t.hemiI; sun.intensity = t.sun;
  ground.material.color.set(t.ground); slabMats.forEach(o=>o.m.color.set(o.pi===0?t.slab0:t.slab)); aisleMats.forEach(m=>m.color.set(t.aisle)); beamMats.forEach(m=>m.color.set(t.beam));
  $('v-theme').innerHTML = ic(name==='dark'?'sun':'moon');
}
$('v-theme').onclick = ()=>applyTheme(themeName==='dark'?'light':'dark');

// ══ BUCLE ══════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const real = clock.getDelta(), dt = Math.min(.05,real), t = clock.elapsedTime;
  if(tween){ tween.t = Math.min(1, tween.t+real/tween.dur); const e = 1-Math.pow(1-tween.t,3); camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); if(tween.t>=1) tween = null; }
  updateReps(dt,t);
  if(sel && sel.type==='rep' && sel.ref.g){ const p = sel.ref.g.position; selRing.visible = selArrow.visible = floorVisible(sel.ref.piso); selRing.position.set(p.x,p.y+.06,p.z); selArrow.position.set(p.x,p.y+3.6+Math.sin(t*6)*.25,p.z); selRing.rotation.z = t*2; }
  controls.update(); renderer.render(scene,camera);
}

// ══ ARRANQUE + REFRESCO ════════════════════════════════════════════════════
async function boot(){
  await loadAll(); rebuildReps(); applyLayer(); applyFloorVisibility(); renderPanels();
}
applyTheme(themeName); $('tab-sec').textContent = '⏱ SLA';
boot().then(()=>{ setTimeout(()=>$('loading').classList.add('done'), 300); });
setInterval(async ()=>{ const keep = sel; await loadAll(); rebuildReps(); applyLayer(); applyFloorVisibility(); renderPanels(); if(keep && keep.type==='rep'){ const r = [...allReps,...allPickReps].find(x=>repLdap(x)===repLdap(keep.ref)&&x.g); if(r) selectRep(r,false); } }, REFRESH_MS);
setInterval(()=>{ if(currentProcess==='PICKING'||activeTab==='sec') renderPanels(); else renderChips(); }, 30000);
window.__mez = {scene,camera,controls,floors,GEO,get reps(){return repGroups},selectRep,focusCalle,setFloor,setProcess,setLayer,goHome,isDemoRef:()=>isDemo};
frame();
</script>
