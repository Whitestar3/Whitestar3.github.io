<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SKYNET · CD-01 Layout</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Si algo falla al iniciar, se muestra el error en pantalla (en vez de quedar en blanco) */
window.addEventListener('error', function(e){
  var l = document.getElementById('loading'); if(!l) return;
  l.classList.remove('done'); l.querySelector('div').innerHTML = '<b style="color:#b91c1c">No se pudo iniciar el layout</b><span style="max-width:520px;text-align:center;line-height:1.5">'+ (e.message||'error') +'<br><small>'+ (e.filename||'').split('/').pop() +':'+ (e.lineno||'') +'</small></span>';
});
if(!window.THREE) document.addEventListener('DOMContentLoaded', function(){ var l=document.getElementById('loading'); if(l) l.querySelector('div').innerHTML='<b style="color:#b91c1c">No se pudo cargar three.js</b><span>Este entorno bloquea cdnjs.cloudflare.com</span>'; });
/* ── Qué página abre cada zona (todo embebido: este archivo no depende de otros) ──
   file = copia local (carpeta paginas/) · grid = el documento publicado en Grid */
window.SKYNET_PAGES = {
  stage:    { name:'Stage',        color:'#e84040', file:'stage-3d.html',                  grid:'' },
  checkin:  { name:'Check-in',     color:'#f0c040', file:'checkin-completo.html',         grid:'' },
  mezanina: { name:'Mezanina',     color:'#b060f0', file:'mezanina.html', grid:'' },
  batch:    { name:'Batch Sorter', color:'#40b0f0', file:'',              grid:'' },
  packing:  { name:'Packing',      color:'#40d080', file:'packing-3d.html',              grid:'' }
};
window.SKYNET_ZONE_PAGE = { pin:'stage', sin:'stage', chs:'checkin', cht:'checkin', mz:'mezanina', pwi:'batch', pkm:'packing', pkh:'packing' };
window.SKYNET_IN_GRID = false;
</script>
<style>
  :root{--bg:#e8eef7;--card:rgba(255,255,255,.94);--cardb:#e1e8f2;--txt:#0f1b2d;--mut:#64748b;--acc:#2563eb;--accbg:#e8efff;
        --ok:#15803d;--okbg:#e4f6ea;--warn:#b45309;--warnbg:#fdf0d8;--bad:#b91c1c;--badbg:#fde7e7;--chip:#f1f5fb;--line:#e8eef6;
        --shadow:0 12px 32px rgba(30,60,120,.15),0 1px 3px rgba(30,60,120,.08)}
  body.dark{--bg:#0b1118;--card:rgba(17,26,37,.93);--cardb:rgba(255,255,255,.08);--txt:#e6edf3;--mut:#8b9aab;--acc:#6ea0ff;--accbg:rgba(110,160,255,.16);
        --ok:#4ade80;--okbg:rgba(34,197,94,.16);--warn:#fbbf24;--warnbg:rgba(245,158,11,.16);--bad:#f87171;--badbg:rgba(239,68,68,.18);--chip:rgba(255,255,255,.05);--line:rgba(255,255,255,.07);
        --shadow:0 12px 32px rgba(0,0,0,.5)}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,sans-serif}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);user-select:none;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  svg{display:block}
  .card{background:var(--card);border:1px solid var(--cardb);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
  small{color:var(--mut);font-size:.68rem}

  #top{position:fixed;top:10px;left:14px;right:14px;height:52px;z-index:20;display:flex;align-items:center;gap:10px;padding:0 10px 0 8px;border-radius:14px}
  .logo{display:flex;align-items:center;gap:9px;padding-right:2px}
  .logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center}
  .logo b{font-size:.98rem;letter-spacing:.3px}
  .areas-wrap{position:relative}
  .areas-btn{display:flex;align-items:center;gap:9px;height:38px;padding:0 11px 0 11px;border-radius:11px;background:var(--acc);color:#fff;font-weight:700;font-size:.86rem;box-shadow:0 4px 12px rgba(37,99,235,.32)}
  .areas-btn:hover{filter:brightness(1.1)}.areas-btn.open{filter:brightness(.9)}
  .areas-btn em{font-style:normal;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:1px 7px}
  .search{position:relative;flex:0 1 250px;min-width:140px}
  .search .box{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid var(--cardb);border-radius:11px;background:var(--chip);color:var(--mut)}
  .search input{flex:1;border:0;outline:0;background:none;font-size:.8rem;color:var(--txt);user-select:text;min-width:0}
  .search input::placeholder{color:var(--mut)}
  kbd{font:600 .64rem 'Segoe UI',sans-serif;border:1px solid var(--cardb);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--mut);background:var(--card)}
  .pop{position:absolute;top:46px;left:0;right:0;border-radius:14px;padding:6px;display:none;max-height:340px;overflow:auto}
  .pop.open{display:block}
  .pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:.8rem}
  .pop .it:hover,.pop .it.hi{background:var(--accbg)}
  .pop .it .t{flex:1;min-width:0}.pop .it .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pop .empty{padding:14px;text-align:center;color:var(--mut);font-size:.78rem}
  .tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accbg);color:var(--acc)}
  .sp{flex:1}
  .chips{display:flex;gap:6px}
  .chip{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px 0 9px;border-radius:11px;background:var(--chip);border:1px solid var(--cardb);white-space:nowrap;cursor:default}
  .chip svg{color:var(--acc)}.chip b{font-size:.98rem;font-variant-numeric:tabular-nums;line-height:1}
  .chip small{font-size:.64rem}
  .chip em{font-style:normal;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:5px}
  .chip.bad svg,.chip.bad b{color:var(--bad)}
  .up{color:var(--ok);background:var(--okbg)}.dn{color:var(--bad);background:var(--badbg)}.eq{color:var(--mut);background:transparent}
  .site{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 6px;border:1px solid var(--cardb);border-radius:11px;background:var(--chip);white-space:nowrap}
  .site .code{background:var(--chip);color:var(--acc);font-weight:700;font-size:.7rem;border-radius:7px;padding:5px 7px;letter-spacing:.3px;border:1px solid var(--cardb)}
  .live{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:600;font-size:.74rem;white-space:nowrap}
  .live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#f59e0b,#ea580c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.74rem;flex:none}

  #vctl{position:fixed;top:72px;right:14px;z-index:12;width:44px;padding:4px;display:flex;flex-direction:column;gap:1px;border-radius:13px}
  .ibtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut);position:relative}
  .ibtn:hover{background:var(--chip);color:var(--txt)}.ibtn.on{background:var(--accbg);color:var(--acc)}
  #vctl hr{border:0;border-top:1px solid var(--line);margin:3px 2px}
  #vctl .sp1{font:700 .68rem 'Segoe UI'}

  #areas{right:auto;width:316px;padding:10px 10px 8px;top:46px;max-height:calc(100vh - 90px)}
  #areas .zh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px}
  #areas .zh b{font-size:.82rem}
  .mini{font-size:.66rem;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--chip);color:var(--mut)}
  .mini:hover{background:var(--accbg);color:var(--acc)}
  .zrow{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;font-size:.76rem;cursor:pointer}
  .zrow:hover{background:var(--chip)}
  .zrow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zrow .go{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--acc);background:var(--accbg);flex:none}
  .zrow .go:hover{background:var(--acc);color:#fff}
  .zrow .go.none{background:none;color:var(--mut);opacity:.35;cursor:default}
  .sw{width:26px;height:15px;border-radius:8px;background:var(--c,#2563eb);position:relative;flex:none;cursor:pointer;transition:background .15s}
  .sw::after{content:'';position:absolute;top:2px;left:13px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .zrow.off{opacity:.5}.zrow.off .sw{background:#aab6c6}.zrow.off .sw::after{left:2px}
  .zrow.shell{margin-top:4px;border-top:1px solid var(--line);padding-top:8px;border-radius:0}
  .zhint{margin-top:8px;font-size:.64rem;color:var(--mut);line-height:1.4}

  .logo{cursor:pointer;height:40px;padding:0 8px 0 4px;border-radius:11px;color:var(--txt)}
  .logo:hover{background:var(--chip)}.logo:hover .mark{filter:brightness(1.15)}.logo.open .mark{box-shadow:0 0 0 3px var(--accbg)}
  #dock{position:fixed;top:70px;left:14px;z-index:25;width:88px;padding:8px 6px 10px;display:none;flex-direction:column;align-items:center;border-radius:22px}
  #dock.open{display:flex}
  .dclose{width:26px;height:22px;border-radius:7px;background:var(--chip);color:var(--mut);display:grid;place-items:center;margin-bottom:6px}
  .dclose:hover{background:var(--cardb);color:var(--txt)}
  .dbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;padding:6px 0;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .dbtn:hover:not(.lock){transform:translateX(4px) scale(1.08)}
  .dcube{width:48px;height:48px;border-radius:13px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:1.45rem;position:relative;transform:rotateY(-10deg);
    box-shadow:4px 0 0 color-mix(in srgb,var(--c) 45%,#000 55%),7px 0 0 color-mix(in srgb,var(--c) 25%,#000 75%),0 3px 12px color-mix(in srgb,var(--c) 38%,transparent 62%)}
  .dcube::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;border-radius:13px 13px 0 0;background:linear-gradient(to bottom,rgba(255,255,255,.2),transparent)}
  .dlbl{font-size:.58rem;font-weight:700;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .dbtn.lock{opacity:.4;cursor:not-allowed}.dbtn.lock .dcube{filter:grayscale(.7)}
  .dsep{width:34px;height:1px;background:var(--line);margin:4px 0}
  #info{position:fixed;bottom:14px;right:14px;width:262px;z-index:12;padding:10px 12px 11px;display:none}
  #info .ih{display:flex;align-items:center;gap:9px}
  #info .tile{width:34px;height:34px;border-radius:10px}
  #info .tt{flex:1;min-width:0}
  #info .eyebrow{font-size:.58rem;font-weight:700;letter-spacing:.6px;color:var(--acc);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #info b.title{display:block;font-size:.92rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #info .ibtn{width:26px;height:26px;border-radius:8px}
  .pill{display:inline-flex;align-items:center;font-size:.66rem;font-weight:700;padding:2px 9px;border-radius:6px;white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--accbg);color:var(--acc)}.pill.mut{background:var(--chip);color:var(--mut)}
  #info .st{display:flex;align-items:center;gap:8px;margin:9px 0 5px;font-size:.7rem;color:var(--mut)}
  .bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 4px}.bar i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .5s}
  .bar.ok i{background:#22c55e}.bar.warn i{background:#f59e0b}.bar.bad i{background:#ef4444}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:.73rem}
  .kv span{color:var(--mut)}.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .open-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:32px;margin-top:8px;border-radius:9px;background:var(--acc);color:#fff;font-weight:700;font-size:.76rem}
  .open-btn:hover{filter:brightness(1.1)}
  .open-btn.none{background:var(--chip);color:var(--mut);cursor:default;filter:none}

  #tip{position:fixed;z-index:30;pointer-events:none;display:none;background:var(--card);border:1px solid var(--cardb);box-shadow:var(--shadow);border-radius:10px;padding:7px 12px;font-size:.76rem;font-weight:600;line-height:1.35}
  #tip small{display:block;font-weight:500}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:40;background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #loading{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .6s}
  #loading.done{opacity:0;pointer-events:none}
  #loading div{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mut);font-size:.8rem}
  #loading i{width:34px;height:34px;border-radius:50%;border:3px solid var(--cardb);border-top-color:var(--acc);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:1360px){ .site{display:none} .chip small{display:none} }
  @media (max-width:1100px){ .live{display:none} .chip:nth-child(n+4){display:none} }
  @media (max-width:820px){ .search{display:none} .chips{display:none} .logo b{display:none} #info{right:14px;width:calc(100vw - 28px)} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div><i></i>Cargando CD-01…</div></div>

<header id="top" class="card">
  <button class="logo" id="logoBtn" title="Áreas del site"><div class="mark" data-ic="cube" data-sz="19"></div><b>SKYNET</b></button>
  <div class="search">
    <div class="box"><span data-ic="search" data-sz="15"></span><input id="q" autocomplete="off" placeholder="Buscar rep (LDAP / ID), IS u OT…"/><kbd>/</kbd></div>
    <div id="qres" class="pop card"></div>
  </div>
  <div class="chips">
    <div class="chip" id="c1"><span data-ic="users" data-sz="16"></span><b id="k1">0</b><em id="k1d" class="eq"></em><small>Reps</small></div>
    <div class="chip" id="c2"><span data-ic="box" data-sz="16"></span><b id="k2">0</b><em id="k2d" class="eq"></em><small>Pallets</small></div>
    <div class="chip" id="c3"><span data-ic="truck" data-sz="16"></span><b id="k3">0</b><em id="k3d" class="eq"></em><small>Camiones</small></div>
    <div class="chip" id="c4"><span data-ic="gauge" data-sz="16"></span><b id="k4">0%</b><em id="k4d" class="eq"></em><small>Ocupación</small></div>
    <div class="chip bad" id="c5"><span data-ic="warn" data-sz="16"></span><b id="k5">0</b><small>Alertas</small></div>
  </div>
  <div class="sp"></div>
  <div class="site"><span class="code">CD-01</span><small>Centro de Distribución</small></div>
  <div class="live"><i></i>Operación simulada</div>
  <div class="av" title="Julio · Analista de Operaciones">JU</div>
</header>

<aside id="dock" class="card"><button class="dclose" id="dock-x" title="Cerrar"><span data-ic="close" data-sz="14"></span></button><div id="dockList"></div></aside>

<nav id="vctl" class="card">
  <button class="ibtn" id="v-in"  title="Acercar"><span data-ic="plus"></span></button>
  <button class="ibtn" id="v-out" title="Alejar"><span data-ic="minus"></span></button>
  <button class="ibtn" id="v-rl"  title="Girar izquierda"><span data-ic="rotl"></span></button>
  <button class="ibtn" id="v-rr"  title="Girar derecha"><span data-ic="rotr"></span></button>
  <button class="ibtn" id="v-home" title="Vista general (H)"><span data-ic="home"></span></button>
  <hr/>
  <button class="ibtn on" id="v-lbl" title="Etiquetas (L)"><span data-ic="tag"></span></button>
  <button class="ibtn" id="v-pause" title="Pausar (Espacio)"><span data-ic="pause"></span></button>
  <button class="ibtn" id="v-speed" title="Velocidad"><span class="sp1" id="v-speed-t">1×</span></button>
  <button class="ibtn" id="v-theme" title="Claro / oscuro"><span data-ic="moon"></span></button>
</nav>

<aside id="info" class="card">
  <div class="ih"><div class="tile" id="i-ic"></div><div class="tt"><div class="eyebrow" id="i-eye"></div><b class="title" id="i-title"></b></div>
    <button class="ibtn" id="i-x" title="Cerrar (Esc)"><span data-ic="close" data-sz="14"></span></button></div>
  <div id="i-body"></div>
  <button class="open-btn" id="i-open">Abrir página de detalle <span data-ic="open" data-sz="14"></span></button>
</aside>

<div id="tip"></div><div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   SKYNET · CD-01 — LAYOUT (solo mapa 3D)
   El detalle y los datos de cada zona viven en sus propias páginas (ver config.js).
   Click en una zona → se abre su página 3D en una pestaña nueva.
   ════════════════════════════════════════════════════════════════════════════ */
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const $ = id => document.getElementById(id);

const ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  rotl:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>', rotr:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.2"/>', pause:'<path d="M8 5v14M16 5v14"/>', play:'<path d="M7 4l13 8-13 8z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>', moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-4 3.5-5.5 6.5-5.5s5.8 1.5 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .6 3.2 2.3 3.5 5.2"/>',
  box:'<path d="M12 3l9 4.5v9L12 21l-9-4.5v-9L12 3z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/>', cube:'<path d="M12 3l9 4.5v9L12 21l-9-4.5v-9L12 3z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/>',
  truck:'<rect x="2" y="6" width="12" height="10" rx="1"/><path d="M14 9.5h4l3 3.5v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  gauge:'<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/>', zone:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/>',
  open:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  chevd:'<path d="M6 9l6 6 6-6"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>', warn:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/>', person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-6 8-6s7 1 8 6"/>'
};
const ic = (k,sz=18) => `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||''}</svg>`;
document.querySelectorAll('[data-ic]').forEach(e=>{ e.innerHTML = ic(e.dataset.ic, +(e.dataset.sz||18)); });

// Control de cámara propio (rotar: click izq · mover: click der o Shift · zoom: rueda). Reemplaza a OrbitControls para no depender de CDNs externos.
class SimpleOrbit {
  constructor(camera, dom){
    this.camera = camera; this.dom = dom; this.target = new THREE.Vector3();
    this.minDistance = 10; this.maxDistance = 260; this.minPolarAngle = .05; this.maxPolarAngle = Math.PI*.47; this.enableDamping = true;
    this.dTheta = 0; this.dPhi = 0; this.dZoom = 0; this.pan = new THREE.Vector3(); this.ptrs = new Map(); this.pinch = 0;
    dom.style.touchAction = 'none';
    dom.addEventListener('contextmenu', e=>e.preventDefault());
    dom.addEventListener('pointerdown', e=>{ try{ dom.setPointerCapture(e.pointerId); }catch(_){} this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); this.pinch = this._pinchDist(); });
    dom.addEventListener('pointermove', e=>{
      const p = this.ptrs.get(e.pointerId); if(!p) return;
      const dx = e.clientX-p.x, dy = e.clientY-p.y; p.x = e.clientX; p.y = e.clientY;
      if(this.ptrs.size===1){
        if(e.buttons&2 || e.shiftKey || e.ctrlKey) this._panBy(dx,dy);
        else { const h = Math.max(1,dom.clientHeight); this.dTheta -= 2*Math.PI*dx/h; this.dPhi -= 2*Math.PI*dy/h; }
      } else if(this.ptrs.size===2){ const d = this._pinchDist(); if(this.pinch) this.dZoom += (this.pinch-d)*.006; this.pinch = d; }
    });
    const up = e=>{ this.ptrs.delete(e.pointerId); this.pinch = 0; };
    dom.addEventListener('pointerup', up); dom.addEventListener('pointercancel', up);
    dom.addEventListener('wheel', e=>{ e.preventDefault(); this.dZoom += Math.sign(e.deltaY)*.14; }, {passive:false});
  }
  _pinchDist(){ if(this.ptrs.size<2) return 0; const [a,b] = [...this.ptrs.values()]; return Math.hypot(a.x-b.x,a.y-b.y); }
  _panBy(dx,dy){
    const cam = this.camera, k = 2*cam.position.distanceTo(this.target)*Math.tan(cam.fov*Math.PI/360)/Math.max(1,this.dom.clientHeight);
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrix,0); right.y = 0; right.normalize();
    const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    this.pan.addScaledVector(right,-dx*k).addScaledVector(fwd,dy*k);
  }
  update(){
    const off = this.camera.position.clone().sub(this.target), s = new THREE.Spherical().setFromVector3(off), k = this.enableDamping ? .2 : 1;
    s.theta += this.dTheta*k; s.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, s.phi + this.dPhi*k));
    s.radius = Math.max(this.minDistance, Math.min(this.maxDistance, s.radius*(1+this.dZoom*k)));
    this.target.addScaledVector(this.pan,k);
    this.dTheta *= 1-k; this.dPhi *= 1-k; this.dZoom *= 1-k; this.pan.multiplyScalar(1-k);
    off.setFromSpherical(s); this.camera.position.copy(this.target).add(off); this.camera.lookAt(this.target);
  }
}

const LABELS = [];
function drawLabel(L){
  const {cv,text,color,fs} = L, g = cv.getContext('2d'), w = cv.width, h = cv.height, dark = themeName==='dark';
  g.clearRect(0,0,w,h);
  const r = h*.3; g.beginPath(); g.moveTo(r,2); g.arcTo(w-2,2,w-2,h-2,r); g.arcTo(w-2,h-2,2,h-2,r); g.arcTo(2,h-2,2,2,r); g.arcTo(2,2,w-2,2,r); g.closePath();
  g.fillStyle = dark ? 'rgba(14,21,30,.92)' : 'rgba(255,255,255,.96)'; g.fill();
  g.lineWidth = 4; g.strokeStyle = dark ? 'rgba(255,255,255,.14)' : 'rgba(15,27,45,.12)'; g.stroke();
  g.fillStyle = color; g.beginPath(); g.arc(h*.5, h/2, h*.14, 0, 7); g.fill();
  g.fillStyle = dark ? '#f1f5f9' : '#0f1b2d'; g.font = `600 ${fs}px Inter,Segoe UI,sans-serif`; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(text, h*.8, h/2+2);
  L.tex.needsUpdate = true;
}
function makeLabel(text, color, w, h, fs, worldW){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;

  L.sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:L.tex, depthTest:false, transparent:true}));

}

    body = kv('Zona actual', z.name) + kv('Cantidad', o.units+' unidades') + kv('Peso bruto', o.kg+' kg') + kv('Seller', o.seller) + kv('Inbound (IS)', o.inbound);
  } else {
    const k = o.info, pr = truckProg(o), done = Math.round(pr*k.n);
    eye = (o.y.kind==='in'?'Camión inbound · ':'Camión outbound · ')+k.carrier; title = k.id; icon = 'truck'; pill = `<span class="pill ${o.state==='load'?'info':'mut'}">${truckStatus(o)}</span>`;
    extra = `<div class="bar"><i style="width:${pr*100}%"></i></div>`;
    body = kv('Muelle', dockName(o)) + kv('Transportista', k.carrier) + kv('Carga', `${done} / ${k.n} pallets`) + (k.is ? kv('Inbound (IS)', k.is) : '') + (k.ot ? kv('Outbound (OT)', k.ot) : '');
  }
  const hasPage = !!z.page, btn = $('i-open');
  btn.classList.toggle('none', !hasPage); btn.firstChild.nodeValue = hasPage ? 'Abrir página de detalle ' : 'Detalle de esta zona: próximamente ';
  if(full){ $('i-eye').textContent = eye; $('i-title').textContent = title; $('i-ic').innerHTML = ic(icon,18); }
  setHTML($('i-body'), `<div class="st">${pill}<span>${z.name}</span></div>${extra}${body}`);
}
function updateSel(){
  if(!sel) return;
  const o = sel.ref;
  if((sel.type==='truck' && !o.truck) || (sel.type==='pallet' && !pallets.includes(o))){ clearSel(); return; }
  if(sel.type==='zone') setBracket(o);
  else if(sel.type==='truck'){ const b = new THREE.Box3().setFromObject(o.truck); setBracketBox(b.min.x-.3,b.max.x+.3,b.min.z-.3,b.max.z+.3,.2); }
  else if(sel.type==='pallet'){ const p = o.g.position; setBracketBox(p.x-.9,p.x+.9,p.z-1,p.z+1,p.y+.05); }
  else bracket.visible = false;
  selRing.visible = sel.type==='rep'; if(selRing.visible) selRing.position.set(o.g.position.x, o.g.position.y+.05, o.g.position.z);
}

// ── Selección con el mouse ───────────────────────────────────────────────────
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
function pickAt(ev){
  mouse.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,camera);
  const list = [
    ...reps.filter(r=>Z[r.zone].on).map(r=>r.body),
    ...pallets.filter(p=>Z[p.zone].on).flatMap(p=>p.pick),
    ...yards.flatMap(y=>y.zone.on ? y.docks.filter(d=>d.truck).flatMap(d=>d.truck.userData.pick) : []),
    ...pads.filter(p=>p.userData.zone.on)
  ];
  const h = ray.intersectObjects(list,false)[0]; if(!h) return null; const u = h.object.userData;
  if(u.rep) return {type:'rep', ref:u.rep, text:`${u.rep.name} · ${Z[u.rep.zone].name}`};
  if(u.pallet) return {type:'pallet', ref:u.pallet, text:`${u.pallet.id} · ${u.pallet.seller}`};
  if(u.dock) return {type:'truck', ref:u.dock, text:`${u.dock.info.id} · ${u.dock.info.carrier}`};
  return {type:'zone', ref:u.zone, text:`${u.zone.name} · ${u.zone.reps}/${u.zone.cap} reps`};
}
canvas.addEventListener('pointermove', ev=>{
  const p = pickAt(ev); hoverZone = p && p.type==='zone' ? p.ref : null; tip.style.display = 'none';
  if(p){ tip.innerHTML = `${p.text}<small>Click: acercar y ver info</small>`; tip.style.display = 'block'; tip.style.left = (ev.clientX+14)+'px'; tip.style.top = (ev.clientY+14)+'px'; }
  if(!sel){ if(hoverZone) setBracket(hoverZone); else bracket.visible = false; }
  canvas.style.cursor = p ? 'pointer' : 'default';
});
canvas.addEventListener('pointerdown', ev=>{ down = {x:ev.clientX,y:ev.clientY}; });
canvas.addEventListener('pointerup', ev=>{
  if(!down || Math.hypot(ev.clientX-down.x, ev.clientY-down.y)>5) return;
  const p = pickAt(ev); if(p) select(p.type, p.ref, true); else clearSel();
});

// ── Controles ────────────────────────────────────────────────────────────────
let paused=false, speed=1, labels=true;
const SPEEDS = [1,3,8];
$('v-in').onclick = ()=>zoomBy(.7); $('v-out').onclick = ()=>zoomBy(1.4);
$('v-rl').onclick = ()=>orbitBy(.6); $('v-rr').onclick = ()=>orbitBy(-.6); $('v-home').onclick = homeFly;
// Menú de áreas: click en el cubo del logo → un cubo por área; cada cubo abre la página de esa área
const DOCK = [ ['stage','🚚','Stage'], ['checkin','✅','Check-in'], ['mezanina','🏢','Mezanina'], ['batch','🔀','Sorter'], ['packing','📦','Packing'], null, ['hs','🔒','HS'], ['rk','🔒','RK'] ];
DOCK.forEach(it=>{
  if(!it){ const s = document.createElement('div'); s.className = 'dsep'; $('dockList').appendChild(s); return; }
  const [key,emoji,label] = it, pg = (window.SKYNET_PAGES||{})[key], b = document.createElement('button');
  b.className = 'dbtn' + (pg ? '' : ' lock'); b.style.setProperty('--c', pg ? pg.color : '#44475a'); b.title = pg ? 'Abrir '+pg.name : label+': próximamente';
  b.innerHTML = `<div class="dcube">${emoji}</div><div class="dlbl">${label}</div>`;
  b.onclick = e=>{ e.stopPropagation(); if(pg) openPage(key); else toast(label+': el detalle todavía no está disponible'); };
  $('dockList').appendChild(b);
});
const closeDock = ()=>{ $('dock').classList.remove('open'); $('logoBtn').classList.remove('open'); };
$('logoBtn').onclick = e=>{ e.stopPropagation(); const o = $('dock').classList.toggle('open'); $('logoBtn').classList.toggle('open',o); $('qres').classList.remove('open'); };
$('dock-x').onclick = closeDock;
addEventListener('pointerdown', e=>{ if(!e.target.closest('#dock,#logoBtn')) closeDock(); });
function setLabels(v){ labels = v; $('v-lbl').classList.toggle('on',v); ZD.forEach(z=>{ z.label.visible=v&&z.on; (z.tags||[]).forEach(t=>t.visible=v&&z.on); }); }
$('v-lbl').onclick = ()=>setLabels(!labels);
function setPaused(v){ paused = v; $('v-pause').innerHTML = ic(v?'play':'pause'); $('v-pause').classList.toggle('on',v); }
$('v-pause').onclick = ()=>setPaused(!paused);
$('v-speed').onclick = ()=>{ speed = SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; $('v-speed-t').textContent = speed+'×'; };

function applyTheme(name){
  themeName = name; store.set('skynet-theme', name); document.body.classList.toggle('dark', name==='dark');
  const t = T(), c = new THREE.Color();
  scene.background.set(t.bg); scene.fog.color.set(t.bg); scene.fog.near = t.fogN; scene.fog.far = t.fogF;
  hemi.color.set(t.hemiS); hemi.groundColor.set(t.hemiG); hemi.intensity = t.hemiI; sun.intensity = t.sun;
  ground.material.color.set(t.ground); slabMat.color.set(t.slab); asphaltMats.forEach(m=>m.color.set(t.asphalt)); roadMats.forEach(m=>m.color.set(t.road)); mzSlabMats.forEach(m=>m.color.set(t.mzslab));
  gridD.visible = name==='dark'; gridL.visible = name==='light';
  ROLE_MESHES.forEach(({m,list})=>{ list.forEach((it,i)=>{ if(it.role) m.setColorAt(i, c.set(it.role==='wall'?t.wall:t.door)); }); m.instanceColor.needsUpdate = true; });
  LABELS.forEach(drawLabel);
  $('v-theme').innerHTML = ic(name==='dark'?'sun':'moon');
}
$('v-theme').onclick = ()=>applyTheme(themeName==='dark'?'light':'dark');

// ── Buscador: rep (LDAP · ID · nombre), Inbound Shipment (IS) u Outbound Shipment (OT) ──
let qHi = 0, qItems = [];
function runSearch(){
  let q = $('q').value.trim().toLowerCase(), only = null;
  const m = /^(is|ot)\s*[:#-]?\s*(.*)$/.exec(q); if(m){ only = m[1]; q = m[2]; }
  qItems = [];
  if(q || only){
    if(!only) reps.forEach(r=>{ if(q && (r.ldap.includes(q) || String(r.uid).includes(q) || r.name.toLowerCase().includes(q)))
      qItems.push({ic:'person', t:r.ldap, s:`Rep · ${r.name} · ID ${r.uid} · ${Z[r.zone].name}`, a:()=>select('rep', r, true)}); });
    if(!only || only==='is'){
      const by = new Map();
      yards[0].docks.forEach(d=>{ if(d.truck && d.info.is && d.info.is.includes(q)){ const o = by.get(d.info.is) || {trucks:[],pals:[]}; o.trucks.push(d); by.set(d.info.is,o); } });
      pallets.forEach(p=>{ if(p.inbound.includes(q)){ const o = by.get(p.inbound) || {trucks:[],pals:[]}; o.pals.push(p); by.set(p.inbound,o); } });
      by.forEach((o,is)=>{ const tk = o.trucks[0];
        qItems.push({ic:'truck', t:'IS '+is, s:`Inbound shipment · ${tk ? 'camión '+tk.info.id+' en '+dockName(tk) : 'sin camión en muelle'} · ${o.pals.length} pallets en el site`,
          a:()=>{ if(tk) select('truck', tk, true); else if(o.pals[0]) select('pallet', o.pals[0], true); }}); });
    }
    if(!only || only==='ot') yards[1].docks.forEach(d=>{ if(d.truck && d.info.ot && d.info.ot.includes(q))
      qItems.push({ic:'truck', t:'OT '+d.info.ot, s:`Outbound shipment · camión ${d.info.id} · ${dockName(d)} · ${d.info.carrier}`, a:()=>select('truck', d, true)}); });
  }
  qItems = qItems.slice(0,10); qHi = 0;
  const any = q || only;
  $('qres').innerHTML = any ? (qItems.length ? qItems.map((it,k)=>`<div class="it ${k===0?'hi':''}" data-k="${k}"><div class="tile">${ic(it.ic,16)}</div><div class="t"><b>${it.t}</b><small>${it.s}</small></div></div>`).join('')
    : '<div class="empty">Sin resultados · probá con un LDAP, un ID, "IS 7888…" u "OT 3000…"</div>') : '';
  $('qres').classList.toggle('open', !!any);
}
function goSearch(k){ const it = qItems[k]; if(!it) return; $('qres').classList.remove('open'); $('q').value=''; $('q').blur(); it.a(); }
$('q').addEventListener('input', runSearch);
$('q').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ qHi = (qHi + (e.key==='ArrowDown'?1:-1) + qItems.length) % Math.max(1,qItems.length); document.querySelectorAll('#qres .it').forEach((n,i)=>n.classList.toggle('hi',i===qHi)); e.preventDefault(); }
  else if(e.key==='Enter') goSearch(qHi);
  else if(e.key==='Escape'){ $('q').value=''; $('qres').classList.remove('open'); $('q').blur(); }
});
$('qres').addEventListener('pointerdown', e=>{ const n = e.target.closest('.it'); if(n && n.dataset.k!=null) goSearch(+n.dataset.k); });
addEventListener('pointerdown', e=>{ if(!e.target.closest('.search')) $('qres').classList.remove('open'); });
addEventListener('keydown', e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='/'){ e.preventDefault(); $('q').focus(); }
  else if(e.key==='Escape'){ clearSel(); closeDock(); }
  else if(e.key==='h'||e.key==='H') homeFly();
  else if(e.key==='l'||e.key==='L') setLabels(!labels);
  else if(e.key===' '){ e.preventDefault(); setPaused(!paused); }
});

// ── Indicadores en la barra superior ─────────────────────────────────────────
let base = null, baseAt = 0;
const HOT = new THREE.Color(0xef5350);
function delta(el, cur, b){ const d = cur-b; el.className = d>0?'up':d<0?'dn':'eq'; el.textContent = d>0?'▲'+d:d<0?'▼'+Math.abs(d):''; }
function refreshUI(){
  ZD.forEach(z=>{ z.reps=0; z.pallets=0; });
  reps.forEach(r=>Z[r.zone].reps++); pallets.forEach(p=>Z[p.zone].pallets++);
  const vr = reps.filter(r=>Z[r.zone].on), vp = pallets.filter(p=>Z[p.zone].on);
  let act=0,idle=0,al=0; vr.forEach(r=>{ if(r.status==='active')act++; else if(r.status==='idle')idle++; else al++; });
  const selZone = sel && sel.type==='zone' ? sel.ref : null;
  ZD.forEach(z=>{
    const u = z.reps/z.cap, hot = Math.min(1,Math.max(0,(u-.7)/.6));
    z.padMat.color.copy(z.baseColor).lerp(HOT,hot);
    z.padMat.opacity = (z===hoverZone || z===selZone) ? .5 : .16 + Math.min(1,u)*.2;
    z.line.material.color.copy(z.baseColor).lerp(HOT,hot);
  });
  const docks = yards.flatMap(y=>y.zone.on?y.docks:[]), busy = docks.filter(d=>d.truck), inb = busy.filter(d=>d.y.kind==='in').length;
  const capOn = ZD.filter(z=>z.on).reduce((s,z)=>s+z.cap,0) || 1, occ = Math.round(vr.length/capOn*100);
  if(!base || Date.now()-baseAt>180000){ base = {r:vr.length, p:vp.length, t:busy.length, o:occ}; baseAt = Date.now(); }
  $('k1').textContent = vr.length; delta($('k1d'), vr.length, base.r); $('c1').title = `${act} activos · ${idle} inactivos · ${al} en alerta`;
  $('k2').textContent = vp.length; delta($('k2d'), vp.length, base.p); $('c2').title = `Pallets en flujo · ${shipped} despachados`;
  $('k3').textContent = busy.length; delta($('k3d'), busy.length, base.t); $('c3').title = `${inb} inbound · ${busy.length-inb} outbound`;
  $('k4').textContent = occ+'%'; delta($('k4d'), occ-0, base.o); $('c4').title = occ>=100?'Sobrecarga':occ>=70?'Ocupación dentro de meta (≥ 70%)':'Ocupación bajo meta (< 70%)';
  $('k5').textContent = al; $('c5').title = `${al} reps en alerta`;
  renderInfo(false);
}
setInterval(refreshUI, 500);

// ── Loop ─────────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let fpsN = 0, fpsT = 0, lowQ = false;
function lowQuality(){
  if(lowQ) return; lowQ = true;
  renderer.shadowMap.enabled = false; sun.castShadow = false; renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
  scene.traverse(o=>{ if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true); });
}
function frame(){
  requestAnimationFrame(frame);
  const real = clock.getDelta(), raw = Math.min(.05, real);
  fpsN++; fpsT += real; if(fpsT>=3){ if(fpsN/fpsT < 24) lowQuality(); fpsN=0; fpsT=0; }
  if(tween){ tween.t=Math.min(1,tween.t+real/tween.dur); const e=1-Math.pow(1-tween.t,3);
    camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); if(tween.t>=1) tween=null; }
  if(!paused){ const dt = raw*speed; updateReps(dt); updatePallets(dt); updateTrucks(dt); updateTotes(dt); }
  updateSel();
  controls.update();
  renderer.render(scene,camera);
}
applyTheme(themeName);
refreshUI();
window.__mundo = {scene,camera,controls,Z,reps,pallets,yards,openZone,select,clearSel,get sel(){return sel}};
frame();
setTimeout(()=>$('loading').classList.add('done'), 400);
</script>
